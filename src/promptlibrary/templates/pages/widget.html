{% extends 'base.html' %}
{% block content %}<section class="page-content" id="widget-panel"><h1 id="widget-bubble">Prompt picker</h1><p>Keep this compact page open alongside your work.</p><form action="/widget" method="get" data-submit data-search><label>Search prompts<input type="search" name="q" value="{{ q }}" autocomplete="off"></label><button type="submit">Search</button></form><div class="cards">{% for item in items %}<a href="/prompts/{{ item.id }}" class="card" data-nav><strong>{{ item.title }}</strong><span class="muted">{{ item.status_name }}</span></a>{% else %}<p>No prompts found.</p>{% endfor %}</div></section>{% endblock %}
