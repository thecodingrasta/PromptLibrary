{% macro icon(name, filled=false) -%}
<svg class="icon" viewBox="0 0 24 24" fill="{{ 'currentColor' if filled else 'none' }}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'library' %}<path d="M4 4h6v16H4zM14 4h6v16h-6zM7 8h0M17 8h0"/>
{% elif name == 'star' %}<path d="m12 3 2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L2.9 9.6l6.3-.9z"/>

{% elif name == 'project' %}<path d="M3 6h7l2 3h9v11H3zM3 6V4h7l2 3h8v2"/>
{% elif name == 'backup' %}<path d="M4 4h16v5H4zM5 9v11h14V9M9 13h6M12 13v4"/>
{% elif name == 'settings' %}<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>
{% elif name == 'help' %}<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h0"/>
{% elif name == 'about' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h0"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>
{% elif name == 'moon' %}<path d="M20 14a8 8 0 0 1-10-10 9 9 0 1 0 10 10Z"/>
{% elif name == 'collapse' %}<path d="m14 5-7 7 7 7M20 5l-7 7 7 7"/>
{% elif name == 'copy' %}<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>
{% elif name == 'plus' %}<path d="M12 4v16M4 12h16"/>
{% elif name == 'edit' %}<path d="m4 16-1 5 5-1L20 8l-4-4ZM14 6l4 4"/>
{% elif name == 'trash' %}<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
{% elif name == 'up' %}<path d="m5 14 7-7 7 7"/>
{% elif name == 'down' %}<path d="m5 10 7 7 7-7"/>
{% elif name == 'widget' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/>
{% else %}<circle cx="12" cy="12" r="8"/>{% endif %}
</svg>
{%- endmacro %}
