name: Prepare release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Verify version and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_checksums.py
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "PromptLibrary $RELEASE_TAG" --notes-file CHANGELOG.md
