name: Bug report
description: Report a reproducible problem using non-sensitive sample data.
title: "Bug: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Application and Python versions, OS, browser and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behaviour using invented prompt content.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials, personal content and database paths. Never attach a real database or sync.key.
