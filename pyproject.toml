[project]
name = "promptlibrary"
version = "1.0.0"
description = "A self-hosted prompt management application with versioning, guided workflows, backups, and MCP access."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    {name = "PromptLibrary Contributors"},
]
keywords = ["prompts", "llm", "ai", "prompt-management", "mcp", "workflows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "fastapi>=0.128.2,<1",
    "uvicorn>=0.48.0,<1",
    "jinja2>=3.1.6,<4",
    "aiosqlite>=0.22.1,<1",
    "mistune>=3.2.1,<4",
    "pygments>=2.18.0",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "python-multipart>=0.0.29,<1",
    "httpx>=0.28.1,<1",
    "mcp>=1.26.0,<2",
    "paramiko>=5.1.0,<6",
    "boto3>=1.43.18,<2",
    "defusedxml>=0.7.1",
    "cryptography>=46.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1,<1",
    "ruff==0.16.6",
    "build>=1.2.2",
    "pytest-cov>=7.0",
    "pip-audit>=2.9",
    "types-defusedxml",
    "types-Pygments",
    "types-paramiko",
    "boto3-stubs[s3]",
    "mypy>=1.13.0",
]
e2e = [
    "playwright>=1.49.0",
    "pytest-playwright>=0.5.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "Pillow>=11.0.0",
]
desktop = [
    "pystray>=0.19.5",
    "Pillow>=11.0.0",
]

[project.scripts]
promptlibrary = "promptlibrary.app:main"
promptlibrary-mcp = "promptlibrary.mcp.server:main"
promptlibrary-maintenance = "promptlibrary.maintenance:main"
promptlibrary-tray = "promptlibrary.tray:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptlibrary = ["templates/**/*.html", "static/*", "content/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
# Subprocess commands use argument arrays and known executables, never a shell.
"scripts/*.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pystray", "pystray.*"]
ignore_missing_imports = true
